server {
    listen 80;
    server_name _;
    client_max_body_size 11m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 없는 경로는 index.html로 넘겨 react-router가 처리하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 접두사를 떼고 BE로 넘긴다. vite dev 서버의 rewrite와 동일한 규칙이다.
    location /uploads/ {
        proxy_pass http://app:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Image generation may take longer than palette recommendations.
    location = /api/admin/festival/ticketing-background/recommend {
        proxy_read_timeout 180s;
        proxy_pass http://app:8080/admin/festival/ticketing-background/recommend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_read_timeout 75s;
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
