server {
    listen 80;
    listen [::]:80;
    server_name danzzan.koreacentral.cloudapp.azure.com;

    # Certbot writes the ACME token here through the shared webroot volume.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name danzzan.koreacentral.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/danzzan.koreacentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danzzan.koreacentral.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Operational endpoints are reached from the Docker network, never via
    # the public application origin.
    location ^~ /api/internal/actuator/ {
        return 404;
    }

    # The backend expects paths without the /api prefix, matching Vite's local
    # development proxy rewrite. Docker Compose resolves the service name app.
    # AI generation routes allow time for the backend's 150-second request limit.
    location = /api/admin/festival/1/themes/recommend {
        proxy_read_timeout 180s;
        proxy_pass http://app:8080/admin/festival/1/themes/recommend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/festival/ticketing-background/recommend {
        proxy_read_timeout 180s;
        proxy_pass http://app:8080/admin/festival/ticketing-background/recommend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_read_timeout 75s;
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router receives all non-file routes after static-file lookup.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
